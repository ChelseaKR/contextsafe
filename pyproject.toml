[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "contextsafe"
version = "0.1.0"
description = "Offline synthetic fixture validator and deterministic evaluator"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = []

# The built artifact's only route back to its own context. `readme` puts the whole
# README into the distribution metadata, and every relative link in it — the
# publication policy, the threat model, the ADRs that bound what this tool claims —
# resolves against the repository and nowhere else. A reader holding only the wheel
# needs somewhere to resolve them from.
[project.urls]
Homepage = "https://github.com/ChelseaKR/contextsafe"
Repository = "https://github.com/ChelseaKR/contextsafe"
Changelog = "https://github.com/ChelseaKR/contextsafe/blob/main/CHANGELOG.md"
"Publication policy" = "https://github.com/ChelseaKR/contextsafe/blob/main/docs/17-PUBLICATION-POLICY.md"
"Security policy" = "https://github.com/ChelseaKR/contextsafe/blob/main/SECURITY.md"

[project.scripts]
contextsafe = "contextsafe.cli:main"

[dependency-groups]
dev = [
  "coverage>=7.10",
  "hypothesis>=6.100",
  "jsonschema>=4.23",
  "mypy>=1.18",
  "pip-audit>=2.9",
  "pytest>=8.0",
  "pytest-cov>=6.0",
  "ruff>=0.15.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/contextsafe"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "S", "C90", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
strict = true
warn_return_any = true
disallow_untyped_defs = true
# The trees strict typing claims. Here rather than as an argument to `mypy` in
# the Makefile so that tools/scope_gate.py can read the claim from the config
# that makes it, and so a path on the command line cannot silently narrow it.
files = ["src", "tools"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config --import-mode=importlib"
markers = [
  "smoke: critical end-to-end path",
]

[tool.coverage.run]
branch = true
# `tools` is here because the gate implementations decide whether this
# repository merges, and until 2026-08-27 the coverage floor did not measure
# them at all. See docs/18-ASSURANCE-PROGRAM.md phase 1.
# Paths rather than package names, so `make scope` can compare the claim
# against the tree. `make test` passes a bare `--cov` for the same reason.
source = ["src/contextsafe", "tools"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
