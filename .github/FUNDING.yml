# FUNDING configuration: contextsafe takes no money, on purpose.
#
# This project is dual-use by its own admission, and its publication policy
# names the reader of public project material as an actor in the threat model.
# A public donation prompt is out of place on a repository written under that
# assumption.
#
# There is a real paid path for this work. It belongs in a conversation, not on
# a public page.
#
# Every platform key below is present and explicitly empty. With no active
# entries GitHub renders no Sponsor button, and this file overrides the
# organisation-wide default in ChelseaKR/.github rather than merging with it.

github:           # no GitHub Sponsors
patreon:          # not used
open_collective:  # not used
ko_fi:            # not used
tidelift:         # not used
community_bridge: # not used
liberapay:        # not used
issuehunt:        # not used
lfx_crowdfunding: # not used
polar:            # not used
buy_me_a_coffee:  # not used
thanks_dev:       # not used
custom:           # no external donation links
