# Security scanning (2026-07-16 standards sweep): SAST (Semgrep), secret scanning
# (gitleaks), and dependency audit (pip-audit against the locked uv environment —
# the same `make audit` a contributor runs locally). All jobs run automatically on
# push/PR plus a weekly sweep; none is dispatch-only.
#
# The secret-scan job is full-history, not diff-scoped: it runs the repository's
# own `make secret-scan` over every ref, every object in the object database
# (including unreachable ones), and the working tree. See
# tools/secret-scan-full-history.sh for what each phase covers and why the
# scanner is pinned.
name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 7 * * 0" # weekly, Sunday, staggered off ci.yml's push/PR runs

permissions:
  contents: read

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: SAST (Semgrep, registry auto config)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    container:
      image: semgrep/semgrep@sha256:59fbed6127ea7c5dde3ba6a85142733bb20ea9aaa36120c953904f1539aaf66e # 1.168.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The job runs in a container as a different user than the one that
      # checked the tree out, and both semgrep's target selection and the gate's
      # own `git ls-files` read the repository through git. Without this, git
      # refuses the checkout as dubiously owned: semgrep would silently widen to
      # every file on disk and the gate would exit 2 rather than scan. Marking
      # the workspace safe is the narrowest fix, and it is one path, not `*`.
      - name: Let git read the checkout this container did not create
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      # `semgrep scan`, not `semgrep ci`. On a pull_request event `semgrep ci`
      # resolves a diff baseline and shells out to
      # `git fetch origin --force --depth=1 <head-sha>`. This repository is
      # private and the checkout above sets `persist-credentials: false`, so that
      # fetch died with "could not read Username for 'https://github.com'",
      # semgrep aborted before scanning anything, and its default
      # `--suppress-errors` turned the aborted run into exit 0. Every pull request
      # therefore got a green SAST check over zero scanned files, while the same
      # config on a push to main ran the full scan and went red. `semgrep scan`
      # needs no baseline and no credential, so both events run the identical
      # full scan. That decision is ADR 0004 and it is unchanged; what moved is
      # who reads the result.
      #
      # This step used to be `semgrep scan --config auto --error --strict`, and
      # the flags were the whole verdict. `--error` fails on a finding, which is
      # right and is what the gate below does. `--strict` was supposed to cover
      # the other half, and did not: semgrep reports a file its parser could not
      # finish as a `warn`-level error and still exits 0, so the scan stayed
      # green over the unread remainder of `src/contextsafe/validation.py` for as
      # long as a PEP 695 generic function sat in it, and turned red only on a
      # branch whose larger file set pushed the same warning into exit 3 (#114).
      # A verdict that depends on how many files the run was given is not a gate.
      #
      # So the exit code is no longer the verdict. `tools/sast_gate.py` runs the
      # same scan, writes its JSON, and reads it: exit 1 on any finding, exit 2
      # on a file the parser could not finish, on a tracked source under `src` or
      # `tools` the scanner never opened, and on every way of not getting a scan
      # at all. That is the three-state contract of ADR 0008, which ADR 0004's
      # invocation could not express, and ADR 0012 records the change. The gate
      # program holds the scanner's argv, so this job cannot drift into scanning
      # something other than what `make sast` scans; it is run as `python3` here
      # rather than through `make` because this container ships semgrep and its
      # Python, not the repository's toolchain, and the gate is stdlib-only for
      # exactly that reason.
      #
      # The gate is also pinned to the version of the image above, read out of
      # the report the scan writes. The argv being shared is not enough: 1.168.0
      # is the parser that stops at a PEP 695 generic function and a later one
      # does not, so an unpinned local `make sast` would answer "clean" about the
      # very construct this job cannot finish reading. A mismatch between this
      # image and PINNED_SCANNER_VERSION fails the gate at exit 2, and
      # tests/test_sast_gate.py reads the version comment beside the `image:`
      # line above, so bumping the digest without the constant (or the reverse)
      # fails in `make verify` before it reaches here.
      - run: python3 tools/sast_gate.py

  secret-scan:
    name: secret scanning (gitleaks, full history + object database)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # fetch-depth: 0 brings down every branch and tag as a remote-tracking
      # ref, which is what phase 1's `--log-opts="--all --full-history"` needs.
      # It also brings down the packfile phase 2 enumerates. A shallow checkout
      # would let this job report success over a few commits.
      - name: Checkout (full history — this gate scans every ref and every object)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Not gitleaks-action: that wrapper resolves the scanning binary at run
      # time, so pinning the action does not pin the ruleset. This installs one
      # named release and checks it against a recorded SHA-256.
      - name: Install pinned gitleaks
        id: gitleaks
        uses: ./.github/actions/setup-gitleaks
      # The same command a maintainer runs locally. Findings are redacted, and
      # any finding, any phase, fails the job — no mute, no .gitleaksignore.
      - name: Full-history secret scan (make secret-scan)
        env:
          GITLEAKS_BIN: ${{ steps.gitleaks.outputs.gitleaks-bin }}
        run: make secret-scan

  pip-audit:
    name: dependency audit (pip-audit, locked env)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      UV_PYTHON: "3.12"
      UV_PYTHON_DOWNLOADS: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          check-latest: false
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.28"
          enable-cache: true
      # `make audit`, not a second copy of the command it runs. The two drifted
      # apart the moment the target became `tools/audit_gate.py`, and a job that
      # restates a gate's invocation is a job that can pass while the gate a
      # contributor runs does something else. Exit 1 is an advisory; exit 2 is
      # the advisory service failing to answer, which fails this job too and
      # says so rather than looking like a vulnerability.
      - name: Dependency audit (make audit)
        run: |
          uv sync --locked
          make audit

  publication-sweep:
    # This job existed because ci.yml carried a `paths-ignore` for `**.md` and
    # `docs/**`, which left the one gate whose whole job is documentation
    # hygiene unable to see a documentation change. That skip is gone as of
    # 2026-09-04 (#102), so `make verify` now sweeps every pull request and this
    # job is no longer the only sweep a Markdown-only change gets. It stays for
    # the weekly schedule, which ci.yml does not have: the sweep reads pointers
    # and paths that can go stale without anybody pushing, and a scheduled run
    # is the only thing that looks at a repository nobody is committing to.
    name: publication sweep (no personal paths, internal hosts, dead pointers)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      UV_PYTHON: "3.12"
      UV_PYTHON_DOWNLOADS: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          check-latest: false
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.28"
          enable-cache: true
      - name: make publication-sweep
        run: make publication-sweep
