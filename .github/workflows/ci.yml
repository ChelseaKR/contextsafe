# This workflow runs on every pull request and every push to main, with no
# `paths-ignore`. It carried one for `**.md`, `docs/**` and `LICENSE` until
# 2026-09-04, on the reasoning that a documentation-only change has no code to
# gate. Four stages of `make verify` are documentation gates: `claims`
# re-derives the figures and lists the README and CONTRIBUTING.md state,
# `publication-sweep` reads every tracked file for personal paths and internal
# hosts, `hygiene` scans for unowned markers, and `i18n` reads the catalogs
# whose surfaces the Markdown documents. So a README-only change could break
# `make claims` and merge green, leaving the next code pull request to inherit
# a failure it did not cause. The skip also made `verify` unusable as a
# required status check, because a required check that never runs leaves a
# documentation-only pull request pending forever (#75, #102).
name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      UV_PYTHON: "3.12"
      UV_PYTHON_DOWNLOADS: never
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          check-latest: false

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.28"
          enable-cache: true

      - name: Run the local verification gate
        run: make verify

  determinism:
    # RG-15 and R-10 ask for identical deterministic JSON across three runs and
    # every supported operating system. `verify` proves that on one runner; this
    # job is the cross-platform half, running only tests/test_determinism.py so a
    # platform-dependent line ending, encoding, or path leak fails here instead
    # of in a partner's release evidence. These are GitHub's server SKUs, not the
    # Windows 11 and macOS desktop fresh installs RG-15 requires, and packaged
    # artifacts remain B-045; this job is byte-reproducibility evidence only.
    name: determinism (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    permissions:
      contents: read
    env:
      UV_PYTHON: "3.12"
      UV_PYTHON_DOWNLOADS: never
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          check-latest: false

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.28"
          enable-cache: true

      # --locked fails on lockfile drift; --frozen exits 0 and cannot gate it.
      - name: Install the locked dependency graph, failing on drift
        run: uv sync --locked

      - name: Three-run determinism suite
        run: uv run pytest tests/test_determinism.py

  accessibility:
    # `make verify` runs the stdlib half of B-043 on every push. This job adds
    # axe-core in a headless DOM, which needs the node harness a clean clone does
    # not carry. It is a separate job rather than part of `verify` for that
    # reason — and `make a11y-full` fails with `engine-unavailable` if the
    # harness is missing, so this job cannot silently degrade into the checks
    # `verify` already ran and report the same green.
    name: accessibility (axe-core + built-in checks)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      UV_PYTHON: "3.12"
      UV_PYTHON_DOWNLOADS: never
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          check-latest: false

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.28"
          enable-cache: true

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tools/a11y/package-lock.json

      - name: Install the pinned accessibility harness
        run: make a11y-install

      # --locked fails on lockfile drift; --frozen exits 0 and cannot gate it.
      - name: Install the locked dependency graph, failing on drift
        run: uv sync --locked

      - name: Accessibility gate (built-in checks plus axe-core)
        run: make a11y-full

      - name: Upload the accessibility report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: a11y-report
          path: .a11y/report.json
          if-no-files-found: error
