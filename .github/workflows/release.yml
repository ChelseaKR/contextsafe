# Release pipeline (2026-07-16 standards sweep). Fires on a vX.Y.Z tag — no tag
# exists yet, so this is wired and shaped correctly but has never fired. It re-runs
# the literal `make verify` at the tagged commit (the exact gate a contributor runs
# locally: lint, format, types, tests/coverage, pip-audit, hygiene), gates on a
# matching CHANGELOG section, and builds the sdist/wheel with `uv build`. There is
# deliberately no publish/sign step: ContextSafe has no distribution channel yet,
# and a stub that always "published" would be a false-green gate.
name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-at-tag:
    name: re-verify at tagged commit (make verify) and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      UV_PYTHON: "3.12"
      UV_PYTHON_DOWNLOADS: never
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          check-latest: false
      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.28"
          # Cache off on the tag path: a poisoned cross-run cache is exactly the
          # supply-chain surface a release pipeline must not share with branch CI.
          enable-cache: false
      - name: CHANGELOG carries a section for this tag
        # GITHUB_REF_NAME is the runner-provided env var (no `${{ }}` interpolation
        # — template-injection-safe).
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          grep -Fq "## [${VERSION}]" CHANGELOG.md || {
            echo "CHANGELOG.md has no '## [${VERSION}]' section for tag ${GITHUB_REF_NAME}" >&2
            exit 1
          }
      - name: make verify — the same local gate, at the tagged commit
        run: make verify
      - name: Build sdist and wheel
        run: uv build
